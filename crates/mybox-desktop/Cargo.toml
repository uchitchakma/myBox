[package]
name = "mybox-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Uchit Chakma <contact@uchitchakma.com>", "UCDREAMS TECHNOLOGIES LLP <contact@ucdreams.com>"]
description = "Lightweight desktop GUI application for myBox built with Tauri and Rust"
license = "MIT"
repository = "https://github.com/uchitchakma/myBox"

[lib]
name = "mybox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mybox-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
mybox-core = { path = "../mybox-core" }
log = "0.4"
env_logger = "0.11"
