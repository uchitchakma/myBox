[package]
name = "mybox-cli"
version = "0.1.0"
edition = "2021"
authors = ["Uchit Chakma <contact@uchitchakma.com>", "UCDREAMS TECHNOLOGIES LLP <contact@ucdreams.com>"]
description = "High-performance, lightweight container management CLI for servers and desktop"
license = "MIT"
repository = "https://github.com/uchitchakma/myBox"

[[bin]]
name = "mybox"
path = "src/main.rs"

[dependencies]
mybox-core = { path = "../mybox-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
colored = "2.1"
tabled = { version = "0.15", features = ["ansi"] }
indicatif = "0.17"
anyhow = "1.0"
chrono = "0.4"
serde_json = "1.0"
env_logger = "0.11"
log = "0.4"
